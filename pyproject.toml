[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgertrace"
version = "0.1.0"
description = "Local historical-ledger debugger"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "pydantic>=2,<3", "python-multipart>=0.0.18", "reportlab>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pypdf>=5"]

[tool.setuptools.packages.find]
include = ["ledgertrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
