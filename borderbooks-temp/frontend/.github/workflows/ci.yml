name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: borderbooks
          POSTGRES_PASSWORD: borderbooks
          POSTGRES_DB: borderbooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U borderbooks -d borderbooks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://borderbooks:borderbooks@localhost:5432/borderbooks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm fixture:replay
      - run: pnpm test
