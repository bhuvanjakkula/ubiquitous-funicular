services:
  - type: web
    name: the-scientific-operator
    env: python
    buildCommand: |
      cd risk_pulse
      pip install fastapi uvicorn pydantic
    startCommand: |
      cd risk_pulse
      uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
