services:
  - type: web
    name: the-scientific-operator
    env: python
    buildCommand: |
      cd scientific_operator
      pip install -r requirements.txt
    startCommand: |
      cd scientific_operator
      uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
